# Escuchar en el puerto estandar (en produccion se va agregar el 8883 para TLS)
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
# El certificado del lado del cliente esta desactivado porque nosostros autenticamos a los ESP32 usando usuario/contrasenia
require_certificate false

# Nadie entra sin usuario y contrasenia
allow_anonymous false

# Rutas a los archivos de seguridad 
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl_file

# Logs para depuración
log_type error
log_type warning
log_type notice
log_type information